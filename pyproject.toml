[project]
name = "adom-inspired-roguelike"
version = "0.1.0"
description = "A turn-based ASCII roguelike inspired by ADOM's design philosophy: simple interacting systems producing emergent depth."
requires-python = ">=3.11"
dependencies = [
    "tcod>=21.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roguelike*"]
